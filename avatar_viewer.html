<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Viewer - Stylish Modern Sunglasses</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* Modern, high contrast bottom UI overlay */
    .ui-overlay {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }
    .btn {
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }
    .btn-toggle-glasses {
      background-color: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
    }
    .btn-toggle-glasses.inactive {
      background-color: #222222;
      color: #ffffff;
      border-color: #444444;
    }
    .btn-toggle-glasses:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.2);
    }
    .btn-switch-lighting {
      background-color: #000000;
      color: #ffffff;
      border: 1px solid #ffffff;
    }
    .btn-switch-lighting.shaded {
      background-color: #ffffff;
      color: #000000;
    }
    .btn-switch-lighting:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.2);
    }
    /* Floating loading indicator */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 1px;
      z-index: 50;
      pointer-events: none;
      transition: opacity 0.5s ease;
      background: rgba(0, 0, 0, 0.7);
      padding: 14px 28px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>

  <!-- Import maps polyfill & Three.js ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
        "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
      }
    }
  </script>
</head>
<body>
  <div id="loading">Loading 3D Models...</div>
  <div id="canvas-container"></div>

  <!-- High contrast modern HTML UI overlay -->
  <div class="ui-overlay">
    <button id="toggleGlassesBtn" class="btn btn-toggle-glasses">Toggle Glasses</button>
    <button id="switchLightingBtn" class="btn btn-switch-lighting">Switch Lighting Mode</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import GUI from 'lil-gui';

    // State hooks
    let showGlasses = true;
    let useShadedModel = false;

    // Leva / GUI parameters
    const params = {
      glassesX: 0.01,
      glassesY: 1.35,
      glassesZ: 0.25,
      glassesScale: 0.11
    };

    // Scene Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#111111');

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.35, 2.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.30, 0);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
    directionalLight.position.set(5, 5, 5);
    directionalLight.castShadow = true;
    scene.add(directionalLight);

    // Environment map
    const rgbeLoader = new RGBELoader();
    rgbeLoader.load('/textures/env.hdr', (texture) => {
      texture.mapping = THREE.EquirectangularReflectionMapping;
      scene.environment = texture;
    });

    // Model Storage
    let pbrScene = null;
    let shadedScene = null;
    let glassesScene = null;

    const loader = new GLTFLoader();

    function updateVisibility() {
      if (pbrScene) pbrScene.visible = !useShadedModel;
      if (shadedScene) shadedScene.visible = useShadedModel;
      if (glassesScene) {
        glassesScene.visible = showGlasses;
        glassesScene.position.set(params.glassesX, params.glassesY, params.glassesZ);
        glassesScene.scale.set(params.glassesScale, params.glassesScale, params.glassesScale);
      }
    }

    // Leva / GUI Setup
    const gui = new GUI({ title: 'Glasses Controls' });
    gui.add(params, 'glassesX', -2, 2, 0.01).name('glassesX').onChange(updateVisibility);
    gui.add(params, 'glassesY', -2, 2, 0.01).name('glassesY').onChange(updateVisibility);
    gui.add(params, 'glassesZ', -2, 2, 0.01).name('glassesZ').onChange(updateVisibility);
    gui.add(params, 'glassesScale', 0.01, 3, 0.005).name('glassesScale').onChange(updateVisibility);

    // Load All 3 Models
    Promise.all([
      loader.loadAsync('/base_basic_pbr.glb'),
      loader.loadAsync('/base_basic_shaded.glb'),
      loader.loadAsync('/stylish_modern_high_quality_sunglasses.glb')
    ]).then(([pbrGltf, shadedGltf, glassesGltf]) => {
      pbrScene = pbrGltf.scene;
      shadedScene = shadedGltf.scene;
      glassesScene = glassesGltf.scene;

      scene.add(pbrScene);
      scene.add(shadedScene);
      scene.add(glassesScene);

      updateVisibility();

      const loadingEl = document.getElementById('loading');
      if (loadingEl) loadingEl.style.opacity = '0';
    }).catch(err => {
      console.error('Model load error:', err);
      Promise.all([
        loader.loadAsync('/3d%20character/base_basic_pbr.glb'),
        loader.loadAsync('/3d%20character/base_basic_shaded.glb'),
        loader.loadAsync('/3d%20character/stylish_modern_high_quality_sunglasses.glb')
      ]).then(([pbrGltf, shadedGltf, glassesGltf]) => {
        pbrScene = pbrGltf.scene;
        shadedScene = shadedGltf.scene;
        glassesScene = glassesGltf.scene;

        scene.add(pbrScene);
        scene.add(shadedScene);
        scene.add(glassesScene);

        updateVisibility();

        const loadingEl = document.getElementById('loading');
        if (loadingEl) loadingEl.style.opacity = '0';
      });
    });

    // UI Buttons
    const toggleGlassesBtn = document.getElementById('toggleGlassesBtn');
    toggleGlassesBtn.addEventListener('click', () => {
      showGlasses = !showGlasses;
      toggleGlassesBtn.classList.toggle('inactive', !showGlasses);
      updateVisibility();
    });

    const switchLightingBtn = document.getElementById('switchLightingBtn');
    switchLightingBtn.addEventListener('click', () => {
      useShadedModel = !useShadedModel;
      switchLightingBtn.classList.toggle('shaded', useShadedModel);
      updateVisibility();
    });

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
